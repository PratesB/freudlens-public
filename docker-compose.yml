services:
  # Backend Service (Django Ninja)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: freudlens_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    command: >
      sh -c "python manage.py migrate && 
             python manage.py loaddata questions.json && 
             python manage.py runserver 0.0.0.0:8000"

  # Frontend Service (Vite + Vue)
  frontend:
    image: node:24-alpine
    container_name: freudlens_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
